# Optional local infra for logbook-server (server/), the standalone backend
# that adds entry persistence (Postgres) and file/photo uploads.
#
# This compose file is entirely opt-in. The frontend (npm run dev / build /
# test / preview at the repo root) never depends on Docker, Postgres, or this
# backend being present or running — see docs/INFRASTRUCTURE.md and
# CLAUDE.md's "AI unavailability must never block entry creation" rule, which
# the same philosophy extends to here: no backend, no problem, for the app
# that matters to a mountaineer/skydiver with zero connectivity.
#
# Usage:
#   docker compose up --build      # start db + backend
#   docker compose down            # stop (named volumes persist)
#   docker compose down -v         # stop and wipe db/upload data too
#
# Schema is created by TypeORM migrations (see server/src/database/), which run
# automatically the moment the backend connects (`migrationsRun: true` in
# server/src/database/typeorm.config.ts) — nothing to run by hand for
# `docker compose up` to work against a fresh `db` volume.

services:
  db:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: logbook
      POSTGRES_DB: logbook
    volumes:
      - logbook-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook -d logbook"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      NODE_ENV: development
      DATABASE_URL: postgres://logbook:logbook@db:5432/logbook
      UPLOAD_DIR: /app/uploads
      # MAX_UPLOAD_SIZE_BYTES is deliberately unset: the backend's 25MB default
      # (server/src/config/configuration.ts) matches the client pre-check in
      # src/lib/sync/attachmentValidation.ts. Overriding it lower here makes the
      # client queue photos the server will always reject with 413 (#92).

      # Sign in with Google is the only login method. These come from your
      # shell or from a `.env` file next to this compose file that is not
      # committed (copy `.env.example`) — never commit real values. They
      # default to empty here so `docker compose config/build/down/ps` work
      # without a `.env`; the backend itself refuses to boot (clear error in
      # `docker compose logs backend`) until the required ones are set.
      #   GOOGLE_CLIENT_ID: the OAuth "Web application" client ID from Google
      #     Cloud Console (public, but specific to your project). Required.
      #   ALLOWED_EMAILS: comma-separated e-mail addresses allowed to sign in.
      #     Required.
      #   LEGACY_OWNER_EMAIL: which allowlisted user inherits the entries and
      #     photos that existed before accounts. Optional with one allowed
      #     address (that one inherits); required with several.
      # See docs/INFRASTRUCTURE.md -> "Backend authentication".
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      LEGACY_OWNER_EMAIL: ${LEGACY_OWNER_EMAIL:-}
    volumes:
      # Named volume so uploaded files survive container restarts/recreation
      # (server/.env.example flags the bare default `./uploads` as non-durable).
      - logbook-uploads:/app/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  logbook-db-data:
  logbook-uploads:
