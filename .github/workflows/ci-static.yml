name: CI - Static Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-static-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Each gate is its own job so a red check names the rule that failed. The
  # frontend jobs mirror .githooks/pre-commit. server/ is a standalone NestJS
  # package (see CLAUDE.md); its Jest suite runs against an in-memory sql.js
  # SQLite build, so no Postgres service container is needed here.
  frontend-typecheck:
    name: frontend-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck (tsc -b)
        run: npm run typecheck

  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

  frontend-complexity:
    name: frontend-complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Complexity (nested ifs, cyclomatic, length)
        run: npm run lint:complexity

  frontend-test-coverage:
    name: frontend-test-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Jest with the coverage gate
        run: npm test -- --coverage

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build

  server-typecheck:
    name: server-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  server-lint:
    name: server-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

  server-complexity:
    name: server-complexity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Complexity (nested ifs, cyclomatic, length)
        run: npm run lint:complexity

  server-test-coverage:
    name: server-test-coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Jest with the coverage gate
        run: npm test -- --coverage

  server-build:
    name: server-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

  server-migrations-drift:
    name: server-migrations-drift
    runs-on: ubuntu-latest
    # Runs the baseline (and every future) migration against a real Postgres,
    # then re-runs `migration:generate` and fails if it produces a new
    # migration file. That's the actual risk this job guards against:
    # entities and committed migrations silently diverging (a column added
    # to an entity without a matching migration, a migration hand-edited
    # after being generated, etc.) — the one thing server-test-coverage's
    # sqlite-backed Jest suite structurally cannot catch, since those suites
    # build their schema straight from entities via synchronize, never going
    # through migrations at all (see #21).
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: logbook
          POSTGRES_PASSWORD: logbook
          POSTGRES_DB: logbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logbook -d logbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://logbook:logbook@localhost:5432/logbook
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Run committed migrations against a clean Postgres
        run: npm run migration:run

      - name: Fail if entities and migrations have drifted
        # Delegates to scripts/check-migration-drift.ts (backed by the
        # tested src/database/migration-drift.util.ts) rather than a bare
        # `migration:generate ... || true`: that blanket `|| true` would
        # swallow a genuine CLI crash (bad invocation, connection drop)
        # right alongside TypeORM's deliberate exit-1 "no drift found" case,
        # reporting a false green either way. The script distinguishes them
        # and fails loudly on anything but the documented no-drift message.
        run: npm run migration:drift-check
