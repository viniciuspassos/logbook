name: CI - Dependency Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Audit root dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high --omit=dev

      - name: Audit server dependencies for high/critical vulnerabilities
        working-directory: server
        run: npm audit --audit-level=high --omit=dev
